name = "wsl_cuda"
mpi_launcher = ["mpirun", "-np", "{ranks}"]
# Avoid the observed Open MPI singleton startup delay on this WSL host.
direct_one_rank = false
# One RTX 3070 Ti; additional MPI ranks share the same physical device.
default_ranks = 1
environment = { OMP_NUM_THREADS = "2" }

[run]
work_dir = "{root}"

[build]
source_dir = "{root}/pyfluid_amrex"
build_dir = "{root}/build/pyfluid_amrex-wsl-cuda"
jobs = 6
cmake_args = [
  "-G", "Ninja",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
  "-DCMAKE_CXX_COMPILER=g++",
  "-DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc",
  "-DCMAKE_CUDA_ARCHITECTURES=86",
  "-DCMAKE_CXX_COMPILER_LAUNCHER=cmake;-E;env;CCACHE_DIR={root}/.ccache/pyfluid_amrex;ccache",
  "-DCMAKE_CUDA_COMPILER_LAUNCHER=cmake;-E;env;CCACHE_DIR={root}/.ccache/pyfluid_amrex;ccache",
  "-DAMReX_DIR={root}/.deps/amrex-cuda-fp32-lsolvers-hdf5/lib/cmake/AMReX",
  "-DHDF5_PREFER_PARALLEL=ON",
  "-DPYFLUID_AMREX_NATIVE=OFF",
  "-DPYFLUID_AMREX_PRECISION=SINGLE",
]

[submit]
command = []
header = ["#!/bin/sh"]
