name = "local"
# Open MPI 5's default logical-core binding can pin Apple-silicon ranks to the
# efficiency-core subset. Let macOS place local ranks on performance cores.
mpi_launcher = ["mpirun", "-np", "{ranks}", "--bind-to", "none"]
direct_one_rank = true
default_ranks = 3
# Open MPI 5.0.9's locked-file shared-pointer probe uses a fixed path buffer
# and aborts before HDF5 can open long, informative ID-sequence filenames.
# PyFluid/HDF5 do not use MPI shared-file-pointer operations, so select the
# individual component and avoid the broken locked-file probe entirely.
# AMReX itself remains MPI-only. Two host threads are the sustained optimum for
# the isolated apparent-horizon library on this machine; other solver kernels
# do not see OpenMP compile flags.
environment = { OMP_NUM_THREADS = "2", OMPI_MCA_sharedfp = "individual" }

[run]
work_dir = "{root}"

[build]
source_dir = "{root}/pyfluid_amrex"
build_dir = "{root}/build/pyfluid_amrex"
jobs = 3
cmake_args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCMAKE_OSX_ARCHITECTURES=arm64",
  "-DCMAKE_CXX_COMPILER=/opt/homebrew/bin/mpicxx",
  "-DCMAKE_PREFIX_PATH={root}/.deps/amrex-mpi-lsolvers-hdf5;/opt/homebrew/opt/hdf5-mpi",
  "-DAMReX_DIR={root}/.deps/amrex-mpi-lsolvers-hdf5/lib/cmake/AMReX",
  "-DHDF5_ROOT=/opt/homebrew/opt/hdf5-mpi",
  "-DPYFLUID_AMREX_NATIVE=ON",
]

[submit]
command = []
header = ["#!/bin/sh"]
