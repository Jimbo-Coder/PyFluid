requirements = ["spacetime"]

[[runtime]]
name = "psi4_l2"
label = "\\|\\Psi_4\\|_{2,S}"
operation = "l2_norm"
groups = ["radiation"]
requirements = ["spacetime"]

# Runtime: Modes

[[runtime]]
name = "matter_mode_mass"
label = "C_0"
operation = "volume_integral"
groups = ["modes"]

[[runtime]]
kind = "vector"
family = "matter_barycenter"
names = ["matter_barycenter1", "matter_barycenter2", "matter_barycenter3"]
labels = ["x_{\\rm CM}", "y_{\\rm CM}", "z_{\\rm CM}"]
operation = "derived"
groups = ["modes"]

# Dynamically indexed multipole rows.

[[complex_mode]]
name = "psi4_spin_weighted_surface"
label = "\\Psi_4^{\\ell m}"
basis = "spin_weighted_spherical_harmonic"
domain = "surface"
integrand = "psi4"
requirements = ["spacetime"]

[[complex_mode]]
name = "scalar_azimuthal_surface"
label = "C_m^S[f]"
basis = "azimuthal_fourier_exp_minus_imphi"
domain = "surface"
integrand = "configured_scalar_field"

[[complex_mode]]
name = "matter_azimuthal_volume"
label = "C_m"
basis = "azimuthal_fourier_exp_plus_imphi"
domain = "volume"
integrand = "atmosphere_excluded_dens"

# Derived fields evaluated after evolution.

[[postprocess]]
name = "pressure"
label = "P"
operation = "field"
dependencies = ["rho", "momentum", "energy"]

[[postprocess]]
name = "velocity_mag"
label = "|v|"
operation = "field"
dependencies = ["rho", "momentum"]

[[postprocess]]
name = "schlieren"
label = "|\\nabla\\rho|"
operation = "field"
dependencies = ["rho"]

[[postprocess]]
name = "j_mag"
label = "|J|"
operation = "field"
dependencies = ["j1", "j2", "j3"]

[[postprocess]]
name = "e_mag"
label = "|E|"
operation = "field"
dependencies = ["e1", "e2", "e3"]

[[postprocess]]
name = "vorticity_mag"
label = "|\\omega|"
operation = "field"
dependencies = ["vorticity1", "vorticity2", "vorticity3"]
