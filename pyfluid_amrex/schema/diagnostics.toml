# Canonical diagnostic identities and scalars.tsv ordering.
# The Python catalog is a strict loader; declarations live only here.
schema_version = 1

# Runtime: Coordinates

[[runtime]]
name = "step"
label = "n"
operation = "coordinate"
groups = ["coordinates"]
storage = "integer"

[[runtime]]
name = "time"
label = "t"
operation = "coordinate"
groups = ["coordinates"]

[[runtime]]
name = "dt"
label = "\\Delta t"
operation = "coordinate"
groups = ["coordinates"]

# Runtime: Conservation

[[runtime]]
name = "mass"
label = "M_0"
operation = "volume_integral"
groups = ["conservation"]
dependencies = ["rho"]

[[runtime]]
kind = "vector"
family = "conserved_momentum"
names = ["mom1", "mom2", "mom3"]
labels = ["P_1", "P_2", "P_3"]
operation = "volume_integral"
groups = ["conservation"]
dependencies = ["momentum"]

[[runtime]]
kind = "vector"
family = "coordinate_angular_momentum"
names = ["angular_mom1", "angular_mom2", "angular_mom3"]
labels = ["J_1", "J_2", "J_3"]
operation = "volume_integral"
groups = ["conservation"]
dependencies = ["momentum"]

[[runtime]]
name = "energy"
label = "E"
operation = "volume_integral"
groups = ["conservation"]
dependencies = ["energy"]

# Runtime: Gravity

[[runtime]]
name = "gravity_potential_energy"
label = "E_{\\rm grav}"
operation = "volume_integral"
groups = ["gravity"]
requirements = ["gravity"]

[[runtime]]
name = "gravity_total_energy"
label = "E_{\\rm total}"
operation = "derived"
groups = ["gravity"]
requirements = ["gravity"]

[[runtime]]
name = "gravity_total_energy_rel_drift"
label = "\\Delta E_{\\rm total}/E_{\\rm total,0}"
operation = "derived"
groups = ["gravity"]
requirements = ["gravity"]

# Runtime: Passive

[[runtime]]
