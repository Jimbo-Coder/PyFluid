# Exact rational low-storage updates. Stage i evaluates F(Y_i), then forms
# Y_(i+1) from state=[Y_0,...,Y_i] and rhs=[dt F(Y_0),...,dt F(Y_i)].
# Butcher tableaux, stage times and accepted-state projection weights are derived.
schema_version = 1

[[method]]
name = "euler"
code = 0
enumerator = "TimeEuler"
order = 1
stages = [{state = ["1"], rhs = ["1"]}]

[[method]]
name = "corrector"
code = 1
enumerator = "TimeCorrector"
order = 2
stages = [
  {state = ["1"], rhs = ["1"]},
  {state = ["1/2", "1/2"], rhs = ["0", "1/2"]},
]

[[method]]
name = "midpoint"
code = 2
enumerator = "TimeMidpoint"
order = 2
stages = [
  {state = ["1"], rhs = ["1/2"]},
  {state = ["1", "0"], rhs = ["0", "1"]},
]

[[method]]
name = "ssprk3"
code = 3
enumerator = "TimeSSPRK3"
order = 3
stages = [
  {state = ["1"], rhs = ["1"]},
  {state = ["3/4", "1/4"], rhs = ["0", "1/4"]},
  {state = ["1/3", "0", "2/3"], rhs = ["0", "0", "2/3"]},
]

[[method]]
name = "rk4"
code = 4
enumerator = "TimeRK4"
order = 4
stages = [
  {state = ["1"], rhs = ["1/2"]},
  {state = ["1", "0"], rhs = ["0", "1/2"]},
  {state = ["1", "0", "0"], rhs = ["0", "0", "1"]},
  {state = ["1", "0", "0", "0"], rhs = ["1/6", "1/3", "1/3", "1/6"]},
]
