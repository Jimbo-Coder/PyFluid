# Rotation laws are ordered by their stable generated C++ code.  The catalog
# declares identity and required user parameters; the Euler integral and
# numerical iteration remain generated/C++ science code.
[[rotation_law]]
name = "uniform"
cpp_id = "Uniform"
label = "Uniform angular velocity"
description = "Circular flow with one constant angular velocity."
parameters = ["angular_velocity"]

[[rotation_law]]
name = "j_constant"
cpp_id = "JConstant"
label = "Relativistic j-constant"
description = "Differential rotation with j(Omega) = A^2 (Omega_c - Omega)."
parameters = ["angular_velocity", "differential_rotation_length"]

[[rotation_law]]
name = "q_power"
cpp_id = "QPower"
label = "Relativistic q-power"
description = "Generalized j=A^2 Omega [(Omega_c/Omega)^q-1] rotation; q=1 is j-constant."
parameters = ["angular_velocity", "differential_rotation_length", "rotation_power_q"]

[[rotation_law]]
name = "uryu_plus_13"
cpp_id = "UryuPlus13"
label = "Uryu plus p=1 q=3"
description = "Post-merger differential rotation with an off-center angular-velocity maximum."
parameters = ["angular_velocity", "differential_rotation_length", "differential_rotation_length_b"]

[[rotation_law]]
name = "uryu_j_envelope_p1"
cpp_id = "UryuJEnvelopeP1"
label = "Uryu j-envelope p=1"
description = "Finite-j-envelope post-merger law that limits to j-constant as B tends to infinity."
parameters = ["angular_velocity", "differential_rotation_length", "differential_rotation_length_b"]

# Evolution-start modifiers consume a completed physical-ID state.  They are
# runtime choices rather than compiled owner products.
[[initial_data_perturbation]]
name = "none"
cpp_id = "None"
label = "No perturbation"
description = "Leave the materialized equilibrium unchanged."
parameters = []

[[initial_data_perturbation]]
name = "cold_pressure_scale"
cpp_id = "ColdPressureScale"
label = "Cold pressure scale"
description = "Use scaled cold pressure as a target, invert the same cold EoS for density, and rebuild the complete on-EoS state; density is not held fixed."
parameters = ["perturbation_pressure_scale"]

[[initial_data_perturbation]]
name = "density_azimuthal_espino2019"
cpp_id = "DensityAzimuthalEspino2019"
label = "Espino 2019 density mode"
description = "Apply rho -> rho [1+B (varpi/r_e) sin(m phi + phase)] and rebuild the cold EoS state."
parameters = ["perturbation_amplitude", "perturbation_mode", "perturbation_phase", "perturbation_radius"]

# Magnetic seeds own a divergence-preserving initial field representation.
# A seed is not, by itself, a magnetohydrostatic equilibrium law; the coupled
# RMHD XCTS owner includes its stress in the constraints, while a future
# Grad-Shafranov/Euler first integral will own force balance.
[[initial_data_magnetic_seed]]
name = "none"
cpp_id = "None"
label = "No magnetic seed"
description = "Use the magnetic field supplied by the physical initial-data provider."
parameters = []

[[initial_data_magnetic_seed]]
name = "pressure_poloidal"
cpp_id = "PressurePoloidal"
label = "Pressure-confined poloidal seed"
description = "For a stellar pressure field, construct staggered A proportional to axis cross radius times max(p/pmax-pcut,0)^n, take its discrete curl, and normalize the maximum comoving field."
parameters = ["magnetic_seed_pressure_cutoff", "magnetic_seed_exponent", "magnetic_seed_maximum_comoving_field", "rotation_axis", "rotation_center"]

# Magnetohydrostatic magnetic equilibria are separate from kinematic seeds.
# These methods close both the magnetic field equation and the fluid Euler
# first integral inside the matter/XCTS fixed point.
[[initial_data_magnetic_equilibrium]]
name = "none"
cpp_id = "None"
label = "No magnetic equilibrium"
description = "Do not solve a magnetohydrostatic field equation."
parameters = []

[[initial_data_magnetic_equilibrium]]
name = "poloidal_grad_shafranov"
cpp_id = "PoloidalGradShafranov"
label = "Poloidal Grad-Shafranov"
description = "Solve the conformally flat pure-poloidal Grad-Shafranov equation with M(A_phi)=k_pol(A_phi+xi A_phi^2/2), include its magnetic Bernoulli term, and couple the RMHD stress to XCTS."
parameters = ["magnetic_equilibrium_poloidal_magnetization", "magnetic_equilibrium_nonlinear_poloidal", "magnetic_equilibrium_relaxation", "rotation_axis", "rotation_center"]

# Disk rotation laws are a separate physical catalog.  In particular,
# constant_l means ell=-u_phi/u_t and must not alias the stellar j-constant
# law above.
[[disk_rotation_law]]
name = "constant_l"
cpp_id = "ConstantL"
label = "Constant specific angular momentum"
description = "Stationary circular torus with constant ell=-u_phi/u_t."
parameters = ["specific_angular_momentum", "inner_radius"]

[[disk_rotation_law]]
name = "j_constant"
cpp_id = "JConstant"
label = "Relativistic j-constant"
description = "Stationary circular torus with j(Omega) = A^2 (Omega_c - Omega)."
parameters = ["angular_velocity", "differential_rotation_length", "inner_radius"]

[[disk_rotation_law]]
name = "q_power"
cpp_id = "QPower"
label = "Relativistic q-power"
description = "Stationary circular torus with j=A^2 Omega [(Omega_c/Omega)^q-1]; q=1 is j-constant and the asymptotically flat 1<=q<2 branch has Omega proportional to R^(-2/q)."
parameters = ["angular_velocity", "differential_rotation_length", "rotation_power_q", "inner_radius"]

[[disk_rotation_law]]
name = "uniform"
cpp_id = "Uniform"
label = "Uniform angular velocity"
description = "Circular flow with one constant angular velocity; a finite detached torus is still required."
parameters = ["angular_velocity", "inner_radius"]

# Native single-object initial-data owners. These entries declare broad host
# capabilities and natural solver layouts. Coupled physical restrictions such
# as nonzero rotating CTT stationarity, central-object/disk overlap, and Kerr
# spin/disk alignment remain explicit C++ validation rather than TOML logic.
[[initial_data_owner]]
name = "spherical_tov"
cpp_id = "SphericalTov"
label = "Spherical radial TOV"
description = "One-dimensional spherical TOV construction with an optional mapped radial exterior."
dimension = 1
coordinate = "spherical"
axes = ["r"]
central_objects = ["tov"]
spacetime_methods = ["tov"]
disk_kinds = ["none"]
disk_gravity_modes = ["none"]
grid_kinds = ["uniform", "mapped_radial"]
relative_tilt = false
reflection_class = "spherical"

[[initial_data_owner]]
name = "spherical_axisymmetric_xcts"
cpp_id = "SphericalAxisymmetricXcts"
label = "Spherical axisymmetric XCTS"
description = "Reduced r-theta XCTS construction for circular stars and aligned optional tori."
dimension = 2
coordinate = "spherical"
axes = ["r", "theta"]
central_objects = ["tov", "rotating_star"]
spacetime_methods = ["xcts"]
disk_kinds = ["none", "equilibrium_torus"]
disk_gravity_modes = ["none", "test_fluid", "coupled"]
grid_kinds = ["uniform", "mapped_radial"]
relative_tilt = false
reflection_class = "axis_equatorial"

[[initial_data_owner]]
name = "spherical_axisymmetric_xcts_3d"
cpp_id = "SphericalAxisymmetricXcts3d"
label = "Spherical 3D axisymmetric XCTS"
description = "Full r-theta-phi storage of the axisymmetric circular-star XCTS system with an optional aligned torus."
dimension = 3
coordinate = "spherical"
axes = ["r", "theta", "phi"]
central_objects = ["tov", "rotating_star"]
spacetime_methods = ["xcts"]
disk_kinds = ["none", "equilibrium_torus"]
