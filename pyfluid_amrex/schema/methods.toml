schema_version = 1

# Reconstruction methods are ordered by their stable generated C++ code.  The
# catalog declares identity and stencil/dispatch metadata; formulas remain in
# the reconstruction headers and each compiled method owns one flux entry.
[[reconstruction]]
name = "pwc"
cpp_id = "PWC"
label = "Piecewise constant"
description = "First-order piecewise-constant reconstruction."
stencil_radius = 0
characteristic = false

[[reconstruction]]
name = "pwl"
cpp_id = "PWL"
label = "Piecewise linear MC"
description = "Piecewise-linear primitive reconstruction with the monotonized-central limiter."
stencil_radius = 1
characteristic = false

[[reconstruction]]
name = "wenoz"
cpp_id = "WENOZ"
label = "WENO-Z"
description = "Fifth-order component-wise WENO-Z reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "wenoz-char"
cpp_id = "WENOZChar"
label = "WENO-Z characteristic"
description = "Fifth-order characteristic WENO-Z reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "mp5"
cpp_id = "MP5"
label = "MP5"
description = "Fifth-order component-wise monotonicity-preserving reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "mp5-char"
cpp_id = "MP5Char"
label = "MP5 characteristic"
description = "Fifth-order characteristic monotonicity-preserving reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "teno5"
cpp_id = "TENO5"
label = "TENO5"
description = "Fifth-order component-wise targeted ENO reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "teno5-char"
cpp_id = "TENO5Char"
label = "TENO5 characteristic"
description = "Fifth-order characteristic targeted ENO reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "parabolic"
cpp_id = "Parabolic"
label = "Unlimited parabolic"
description = "Unlimited fourth-order parabolic face interpolation for smooth-reference runs."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "parabolic-char"
cpp_id = "ParabolicChar"
label = "Unlimited parabolic characteristic"
description = "Characteristic unlimited fourth-order parabolic face interpolation."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "ppm4"
cpp_id = "PPM4"
label = "PPM4"
description = "Classic monotonic piecewise-parabolic reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "ppm4-char"
cpp_id = "PPM4Char"
label = "PPM4 characteristic"
description = "Characteristic classic monotonic piecewise-parabolic reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "ppmx"
cpp_id = "PPMX"
label = "PPMX"
description = "Smooth-extremum-preserving piecewise-parabolic reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "ppmx-char"
cpp_id = "PPMXChar"
label = "PPMX characteristic"
description = "Characteristic smooth-extremum-preserving piecewise-parabolic reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "ppm3"
cpp_id = "PPM3"
label = "PPM3"
description = "Limited-slope third-order piecewise-parabolic reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "ppm3-char"
cpp_id = "PPM3Char"
label = "PPM3 characteristic"
description = "Characteristic limited-slope third-order piecewise-parabolic reconstruction."
stencil_radius = 2
characteristic = true

# Rotation laws are ordered by their stable generated C++ code.  The catalog
# declares identity and required user parameters; the Euler integral and
# numerical iteration remain generated/C++ science code.
[[rotation_law]]
name = "uniform"
cpp_id = "Uniform"
label = "Uniform angular velocity"
description = "Circular flow with one constant angular velocity."
parameters = ["angular_velocity"]

[[rotation_law]]
name = "j_constant"
cpp_id = "JConstant"
label = "Relativistic j-constant"
description = "Differential rotation with j(Omega) = A^2 (Omega_c - Omega)."
parameters = ["angular_velocity", "differential_rotation_length"]

[[rotation_law]]
name = "q_power"
cpp_id = "QPower"
label = "Relativistic q-power"
description = "Generalized differential rotation with q=1 equal to j-constant."
parameters = ["angular_velocity", "differential_rotation_length", "rotation_power_q"]

# Disk rotation laws are a separate physical catalog.  In particular,
# constant_l means ell=-u_phi/u_t and must not alias the stellar j-constant
# law above.
[[disk_rotation_law]]
name = "constant_l"
cpp_id = "ConstantL"
label = "Constant specific angular momentum"
description = "Stationary circular torus with constant ell=-u_phi/u_t."
parameters = ["specific_angular_momentum", "inner_radius"]

[[disk_rotation_law]]
name = "j_constant"
cpp_id = "JConstant"
label = "Relativistic j-constant"
description = "Stationary circular torus with j(Omega) = A^2 (Omega_c - Omega)."
parameters = ["angular_velocity", "differential_rotation_length", "inner_radius"]

[[disk_rotation_law]]
name = "q_power"
cpp_id = "QPower"
label = "Relativistic q-power"
description = "Stationary circular torus with the generalized q-power j(Omega) law."
parameters = ["angular_velocity", "differential_rotation_length", "rotation_power_q", "inner_radius"]

[[disk_rotation_law]]
name = "uniform"
cpp_id = "Uniform"
label = "Uniform angular velocity"
description = "Circular flow with one constant angular velocity; a finite detached torus is still required."
parameters = ["angular_velocity", "inner_radius"]

# Native single-object initial-data owners. These entries declare broad host
# capabilities and natural solver layouts. Coupled physical restrictions such
# as nonzero rotating CTT stationarity, central-object/disk overlap, and Kerr
# spin/disk alignment remain explicit C++ validation rather than TOML logic.
[[initial_data_owner]]
name = "spherical_tov"
cpp_id = "SphericalTov"
label = "Spherical radial TOV"
description = "One-dimensional spherical TOV construction with an optional mapped radial exterior."
dimension = 1
coordinate = "spherical"
axes = ["r"]
central_objects = ["tov"]
spacetime_methods = ["tov"]
disk_kinds = ["none"]
disk_gravity_modes = ["none"]
grid_kinds = ["uniform", "mapped_radial"]
relative_tilt = false
reflection_class = "spherical"

[[initial_data_owner]]
name = "spherical_axisymmetric_xcts"
cpp_id = "SphericalAxisymmetricXcts"
label = "Spherical axisymmetric XCTS"
description = "Reduced r-theta XCTS construction for circular stars and aligned optional tori."
dimension = 2
coordinate = "spherical"
axes = ["r", "theta"]
central_objects = ["tov", "rotating_star"]
spacetime_methods = ["xcts"]
disk_kinds = ["none", "equilibrium_torus"]
disk_gravity_modes = ["none", "test_fluid", "coupled"]
grid_kinds = ["uniform", "mapped_radial"]
relative_tilt = false
reflection_class = "axis_equatorial"

[[initial_data_owner]]
name = "cartesian_conformal_constraints"
cpp_id = "CartesianConformalConstraints"
label = "Cartesian conformal constraints"
description = "Full three-dimensional Cartesian CTT, CTTK, or XCTS hierarchy with optional coupled stellar torus."
dimension = 3
coordinate = "cartesian"
axes = ["x", "y", "z"]
central_objects = ["tov", "rotating_star"]
spacetime_methods = ["ctt", "cttk", "xcts"]
disk_kinds = ["none", "equilibrium_torus", "tilted_torus"]
disk_gravity_modes = ["none", "coupled"]
grid_kinds = ["uniform", "block_amr"]
relative_tilt = true
reflection_class = "object_dependent"

[[initial_data_owner]]
name = "spherical_axisymmetric_black_hole_xcts"
cpp_id = "SphericalAxisymmetricBlackHoleXcts"
label = "Spherical axisymmetric black-hole XCTS"
description = "Reduced r-theta XCTS construction on a finite apparent-horizon shell."
dimension = 2
coordinate = "spherical"
axes = ["r", "theta"]
central_objects = ["black_hole"]
spacetime_methods = ["xcts"]
disk_kinds = ["none"]
disk_gravity_modes = ["none"]
grid_kinds = ["uniform_shell", "mapped_radial_shell"]
relative_tilt = false
reflection_class = "axis_equatorial"

[[initial_data_owner]]
name = "cartesian_kerr_schild"
cpp_id = "CartesianKerrSchild"
label = "Cartesian analytic Kerr-Schild"
description = "Exact Kerr-Schild exterior or filled complete-grid black hole with an optional aligned test-fluid torus."
dimension = 3
coordinate = "cartesian"
axes = ["x", "y", "z"]
central_objects = ["black_hole"]
spacetime_methods = ["kerr_schild"]
disk_kinds = ["none", "equilibrium_torus"]
disk_gravity_modes = ["none", "test_fluid"]
grid_kinds = ["uniform", "block_amr"]
relative_tilt = false
reflection_class = "object_dependent"
