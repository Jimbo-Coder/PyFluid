schema_version = 1

# Runtime-selected AMR policies. These flags choose which coordinate-independent
# physical indicators enter one runtime maximum; they are not compiled template
# products. `lohner` preserves the broad legacy curvature behavior, while the
# narrower policies avoid letting atmosphere velocity, magnetization, or an
# outgoing gauge pulse control compact-object refinement.
[[amr_tag_policy]]
name = "none"
cpp_id = "None"
label = "No automatic tagging"
description = "Disable state-based automatic AMR tagging."
default_threshold = 0.35
density = false
pressure = false
velocity = false
magnetic = false
spacetime = false
density_floor_multiple = 0.0

[[amr_tag_policy]]
name = "lohner"
cpp_id = "Lohner"
label = "Broad flow Lohner"
description = "Apply the legacy system-aware Lohner maximum to density, pressure, velocity, magnetic diagnostics, and stored conformal geometry."
default_threshold = 0.08
density = true
pressure = true
velocity = true
magnetic = true
spacetime = true
density_floor_multiple = 0.0

[[amr_tag_policy]]
name = "matter"
cpp_id = "Matter"
label = "Matter support"
description = "Track density-supported matter without allowing atmosphere velocity or magnetization to drive refinement."
default_threshold = 0.08
density = true
pressure = false
velocity = false
magnetic = false
spacetime = false
density_floor_multiple = 10.0

[[amr_tag_policy]]
name = "spacetime"
cpp_id = "Spacetime"
label = "Spacetime geometry"
description = "Track strong-field support through the magnitude of chi-1; intended for vacuum compact-object geometry without following outgoing gauge tails."
default_threshold = 0.15
density = false
pressure = false
velocity = false
magnetic = false
spacetime = true
density_floor_multiple = 0.0

[[amr_tag_policy]]
name = "compact_object"
cpp_id = "CompactObject"
label = "Compact object"
description = "Track density-supported matter and strong-field chi-1 support for GRHD/GRMHD compact objects without following outgoing gauge tails."
default_threshold = 0.15
density = true
pressure = false
velocity = false
magnetic = false
spacetime = true
density_floor_multiple = 10.0

