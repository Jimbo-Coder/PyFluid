schema_version = 1

# Reconstruction methods are ordered by their stable generated C++ code.  The
# catalog declares identity and stencil/dispatch metadata; formulas remain in
# the reconstruction headers and each compiled method owns one flux entry.
[[reconstruction]]
name = "pwc"
cpp_id = "PWC"
label = "Piecewise constant"
description = "First-order piecewise-constant reconstruction."
stencil_radius = 0
characteristic = false

[[reconstruction]]
name = "pwl"
cpp_id = "PWL"
label = "Piecewise linear MC"
description = "Piecewise-linear primitive reconstruction with the monotonized-central limiter."
stencil_radius = 1
characteristic = false

[[reconstruction]]
name = "wenoz"
cpp_id = "WENOZ"
label = "WENO-Z"
description = "Fifth-order component-wise WENO-Z reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "wenoz-char"
cpp_id = "WENOZChar"
label = "WENO-Z characteristic"
description = "Fifth-order characteristic WENO-Z reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "mp5"
cpp_id = "MP5"
label = "MP5"
description = "Fifth-order component-wise monotonicity-preserving reconstruction."
stencil_radius = 2
characteristic = false

[[reconstruction]]
name = "mp5-char"
cpp_id = "MP5Char"
label = "MP5 characteristic"
description = "Fifth-order characteristic monotonicity-preserving reconstruction."
stencil_radius = 2
characteristic = true

[[reconstruction]]
name = "teno5"
cpp_id = "TENO5"
label = "TENO5"
