schema_version = 1

# Physical-ID fields remain declared exclusively in fields.toml.  This catalog
# owns only the human-readable artifact manifest: stable key identity, value
# type, section, and runtime component vocabulary.  Conditional compatibility
# (for example which EoS keys apply) remains C++ physics policy.

[[component_role]]
name = "central_object"
description = "A self-gravitating central star or black hole."

[[component_role]]
name = "matter"
description = "A fluid component coupled to or placed on the central spacetime."

[[component_kind]]
name = "tov"
description = "A spherical nonrotating relativistic star."

[[component_kind]]
name = "rotating_star"
description = "A uniformly or differentially rotating relativistic star."

[[component_kind]]
name = "black_hole"
description = "A black-hole spacetime component."

[[component_kind]]
name = "equilibrium_torus"
description = "An aligned equilibrium torus."

[[component_kind]]
name = "tilted_torus"
description = "A tilted equilibrium torus."

[[component_gravity]]
name = "coupled"
description = "The component contributes to the accepted global constraint solve."

[[component_gravity]]
name = "test_fluid"
description = "The component is supported by a prescribed background spacetime."

[[component_gravity]]
name = "analytic"
description = "The component is represented by an exact analytic spacetime."

[[component_gravity]]
name = "exterior_shell"
description = "The component is a constraint-solved exterior shell with an excluded interior."

